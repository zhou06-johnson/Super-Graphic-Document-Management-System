<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <title>视频剪辑 Demo</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="editor.js"></script>
  <script defer src="ui.js"></script>
  <script defer src="guide.js"></script>
</head>
<body>
  <!-- 图标库 -->
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M6.2 6.2l11.6 11.6M17.8 6.2L6.2 17.8"/>
    </symbol>
    <symbol id="i-caret" viewBox="0 0 24 24">
      <path d="M4 7.2h16L12 18.4z" fill="currentColor"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 4.4L20.2 12 7 19.6z"/>
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24">
      <rect x="7.6" y="4.8" width="3" height="14.4" rx="1.4" fill="currentColor"/>
      <rect x="13.4" y="4.8" width="3" height="14.4" rx="1.4" fill="currentColor"/>
    </symbol>
    <symbol id="i-split" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.6" y="3.6" width="10" height="10" rx="2.2"/>
      <rect x="10.4" y="10.4" width="10" height="10" rx="2.2"/>
    </symbol>
    <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.6 10.6h9.6a4.7 4.7 0 0 1 0 9.4H9.8"/>
      <path d="M8.4 6.2l-4.2 4.4 4.2 4.4"/>
    </symbol>
    <symbol id="i-redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.4 10.6H9.8a4.7 4.7 0 0 0 0 9.4h4.4"/>
      <path d="M15.6 6.2l4.2 4.4-4.2 4.4"/>
    </symbol>
    <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
    </symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
    </symbol>
    <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.8 9.6h3.4L12 5.7v12.6l-4.8-3.9H3.8z"/>
      <path d="M14.8 9.2a4.3 4.3 0 0 1 0 5.6"/>
      <path d="M17.4 6.8a7.6 7.6 0 0 1 0 10.4"/>
    </symbol>
    <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.8 9.6h3.4L12 5.7v12.6l-4.8-3.9H3.8z"/>
      <path d="M15.2 9.6l5.2 5.2M20.4 9.6l-5.2 5.2"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M12 4.6v14.8M4.6 12h14.8"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.8 12.6l4.6 4.6L19.4 6.8"/>
    </symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6.8" cy="17.2" r="2.7"/>
      <circle cx="17.2" cy="17.2" r="2.7"/>
      <path d="M8.6 15.3L18.4 4.2M15.4 15.3L5.6 4.2"/>
    </symbol>
    <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8.6" cy="18" r="3.4"/>
      <path d="M12 18V4.6c3.8.8 5.8 2.4 6.6 5.2"/>
    </symbol>
    <symbol id="i-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.2 5.4h13.6M12 5.4v13.2M8.4 18.6h7.2"/>
    </symbol>
    <symbol id="i-sticker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.7"/>
      <path d="M12.3 3.4c-1.4 3.3-2.9 5-5.5 6.1-1.4.6-2.6.8-3.6.7"/>
      <path d="M12.3 3.4c-.1 2.6.8 4.6 2.8 5.7"/>
    </symbol>
    <symbol id="i-pip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.4" y="4.8" width="15.4" height="13" rx="2.4"/>
      <rect x="6.6" y="8.2" width="8.6" height="6.2" rx="1"/>
      <path d="M6.8 13.6l3.1-3.1 2.6 2.6 1.7-1.7"/>
      <circle cx="18.7" cy="17.8" r="3.4"/>
      <path d="M18.7 16.1v3.4M17 17.8h3.4"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.2l2.8 6 6.3.8-4.6 4.4 1.2 6.3-5.7-3.2-5.7 3.2 1.2-6.3L3 10l6.2-.8z"/>
      <path d="M3.8 20.2l2.6-2.2"/>
    </symbol>
    <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.8" y="3.8" width="6.6" height="6.6" rx="1.6"/>
      <rect x="13.6" y="3.8" width="6.6" height="6.6" rx="1.6"/>
      <rect x="3.8" y="13.6" width="6.6" height="6.6" rx="1.6"/>
      <rect x="13.6" y="13.6" width="6.6" height="6.6" rx="1.6"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.8 7h14.4M9.4 7V4.8h5.2V7M6.8 7l.9 12.2h8.6L17.2 7"/>
      <path d="M10.2 10.6v5.2M13.8 10.6v5.2"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8.6" y="8.6" width="11" height="11" rx="2.2"/>
      <path d="M15.4 8.6V6.2c0-1-.8-1.8-1.8-1.8H6.2c-1 0-1.8.8-1.8 1.8v7.4c0 1 .8 1.8 1.8 1.8h2.4"/>
    </symbol>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9.2" y="3.4" width="5.6" height="10" rx="2.8"/>
      <path d="M5.8 11.4a6.2 6.2 0 0 0 12.4 0M12 17.6v3"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.8" y="4.6" width="16.4" height="14.8" rx="2.4"/>
      <circle cx="8.6" cy="9.6" r="1.6"/>
      <path d="M4.4 17.4l5.2-5 3.6 3.4 2.8-2.6 3.6 3.6"/>
    </symbol>
    <symbol id="i-audio-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.4 3.4H7.2a2 2 0 0 0-2 2v13.2a2 2 0 0 0 2 2h9.6a2 2 0 0 0 2-2V8.8z"/>
      <path d="M13.4 3.4v5.4h5.4"/>
      <path d="M9.4 16.6v-4l3.6 1v3"/>
      <circle cx="8.2" cy="16.8" r="1.2"/>
      <circle cx="11.8" cy="16.4" r="1.2"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.6 7.2c0-1.1.9-2 2-2h3.6l2 2.4h7.2c1.1 0 2 .9 2 2v8.2c0 1.1-.9 2-2 2H5.6c-1.1 0-2-.9-2-2z"/>
    </symbol>
  </svg>

  <div class="app" id="app">
    <!-- 手机状态栏（装饰） -->
    <div class="statusbar" aria-hidden="true">
      <span class="statusbar-time" id="status-time">11:34</span>
      <span class="statusbar-icons">
        <svg class="status-extra" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.8A8.8 8.8 0 0 1 9.2 3.5a8.8 8.8 0 1 0 11.3 11.3z"/>
        </svg>
        <svg class="status-extra" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 7.4l10 8.4-5 4.2V4l5 4.2L7 16.6"/>
        </svg>
        <svg class="status-extra" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5.5" y="3.5" width="13" height="17" rx="3"/>
          <path d="M9 10.5V8.5a3 3 0 0 1 6 0v2"/>
        </svg>
        <svg class="wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M2.5 8.6a14.6 14.6 0 0 1 19 0"/>
          <path d="M6.2 12.4a9.2 9.2 0 0 1 11.6 0"/>
          <path d="M10 16.1a3.7 3.7 0 0 1 4 0"/>
          <circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
        <span class="signal-group"><span class="signal-label">5A</span><span class="signal-bars"><i></i><i></i><i></i><i></i></span></span>
        <span class="signal-group"><span class="signal-label">5A</span><span class="signal-bars"><i></i><i></i><i></i><i></i></span></span>
        <span class="battery"><span class="battery-level">100</span></span>
      </span>
    </div>

    <!-- 顶部操作栏 -->
    <header class="topbar">
      <button class="icon-button close-btn" id="btn-close" type="button" aria-label="关闭项目">
        <svg class="icon icon-30"><use href="#i-close"></use></svg>
      </button>
      <div class="topbar-right">
        <button class="guide-trigger" id="btn-guide" type="button">新手引导</button>
        <button class="quality-btn" id="btn-quality" type="button" aria-haspopup="menu" aria-expanded="false">
          <span id="quality-label">1080p</span>
          <svg class="icon caret"><use href="#i-caret"></use></svg>
        </button>
        <button class="export-btn" id="btn-export" type="button">导出</button>
      </div>
      <div class="quality-menu" id="quality-menu" role="menu" hidden>
        <button type="button" role="menuitemradio" data-quality="480P">480P</button>
        <button type="button" role="menuitemradio" data-quality="720P">720P</button>
        <button type="button" role="menuitemradio" data-quality="1080P" aria-checked="true">1080P</button>
        <button type="button" role="menuitemradio" data-quality="2K">2K</button>
        <button type="button" role="menuitemradio" data-quality="4K">4K</button>
      </div>
    </header>

    <!-- 画面预览 -->
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <video id="preview" src="assets/sample-browser.mp4" playsinline preload="auto" aria-label="视频预览"></video>
        <div class="overlay-layer" id="overlay-layer">
          <div class="text-stack" id="text-stack"></div>
          <div class="sticker-layer" id="sticker-layer"></div>
          <div class="pip-slot" id="pip-slot"></div>
        </div>
        <div class="stage-message" id="stage-message" hidden></div>
        <div class="stage-loader" id="stage-loader" hidden><span></span>正在载入视频…</div>
      </div>
      <button class="preview-exit" id="btn-preview-exit" type="button" aria-label="退出全屏预览" hidden>
        <svg class="icon icon-22"><use href="#i-close"></use></svg>
      </button>
    </div>

    <!-- 播放控制 -->
    <div class="controls">
      <div class="time-display" id="time-display" title="当前时间 / 总时长">
        <span class="time-current" id="time-current">00:00</span>
        <span class="time-sep">|</span>
        <span class="time-total" id="time-total">00:00</span>
      </div>
      <div class="transport">
        <button class="icon-button transport-btn" id="btn-play" type="button" aria-label="播放">
          <svg class="icon icon-26" id="play-icon"><use href="#i-play"></use></svg>
        </button>
        <button class="icon-button transport-btn" id="btn-undo" type="button" aria-label="撤销">
          <svg class="icon icon-25"><use href="#i-undo"></use></svg>
        </button>
        <button class="icon-button transport-btn" id="btn-redo" type="button" aria-label="重做">
          <svg class="icon icon-25"><use href="#i-redo"></use></svg>
        </button>
        <button class="icon-button transport-btn" id="btn-fullscreen" type="button" aria-label="全屏预览">
          <svg class="icon icon-24" id="fullscreen-icon"><use href="#i-expand"></use></svg>
        </button>
      </div>
    </div>

    <!-- 时间轴 -->
    <section class="timeline" id="timeline" aria-label="剪辑时间轴">
      <div class="timeline-content" id="timeline-content">
        <div class="ruler" id="ruler" aria-hidden="true"></div>
        <button class="cover" id="cover" type="button" aria-label="设置封面">
          <canvas id="cover-canvas" width="124" height="120"></canvas>
          <span class="cover-label">设置<br>封面</span>
        </button>
        <div class="clips" id="clips"></div>
      </div>

      <button class="mute-btn" id="btn-mute" type="button" aria-label="关闭原声" aria-pressed="false">
        <svg class="icon icon-20" id="mute-icon"><use href="#i-volume"></use></svg>
        <span id="mute-label">关闭原声</span>
      </button>

      <div class="audio-row" id="audio-row">
        <button class="audio-add" id="btn-add-audio" type="button">
          <svg class="icon icon-18"><use href="#i-plus"></use></svg>
          <span>添加音频</span>
        </button>
      </div>
      <div id="timed-tracks" class="timed-tracks" aria-label="音频、文字和贴纸轨道"></div>

      <button class="add-media" id="btn-add-media" type="button" aria-label="添加视频素材">
        <svg class="icon icon-18"><use href="#i-plus"></use></svg>
      </button>

      <div class="playhead" aria-hidden="true"></div>
    </section>

    <div class="project-scrubber">
      <input id="project-position" type="range" min="0" max="0" step="any" value="0"
        aria-label="快速调整视频位置" disabled>
    </div>

    <!-- 底部工具栏 -->
    <nav class="toolbar" id="toolbar" aria-label="编辑工具">
      <button class="tool" type="button" data-tool="edit">
        <svg class="icon icon-26"><use href="#i-scissors"></use></svg><span>剪辑</span>
      </button>
      <button class="tool" type="button" data-tool="audio">
        <svg class="icon icon-26"><use href="#i-music"></use></svg><span>音频</span>
      </button>
      <button class="tool" type="button" data-tool="text">
        <svg class="icon icon-26"><use href="#i-text"></use></svg><span>文本</span>
      </button>
      <button class="tool" type="button" data-tool="sticker">
        <svg class="icon icon-26"><use href="#i-sticker"></use></svg><span>贴纸</span>
      </button>
      <button class="tool" type="button" data-tool="pip">
        <svg class="icon icon-26"><use href="#i-pip"></use></svg><span>画中画</span>
      </button>
      <button class="tool" type="button" data-tool="effect">
        <svg class="icon icon-26"><use href="#i-star"></use></svg><span>特效</span>
      </button>
      <button class="tool" type="button" data-tool="material">
        <svg class="icon icon-26"><use href="#i-grid"></use></svg><span>素材</span>
      </button>
    </nav>

    <div class="home-indicator" aria-hidden="true"><span></span></div>

    <!-- 工具面板 / 弹窗 / 提示（都限制在手机画面内） -->
    <div class="sheet-root" id="sheet-root" hidden>
      <div class="sheet-scrim" data-close-sheet></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-head">
          <span class="sheet-grip" aria-hidden="true"></span>
          <h2 id="sheet-title">剪辑</h2>
          <button class="icon-button sheet-done" id="sheet-done" type="button" aria-label="完成">
            <svg class="icon icon-22"><use href="#i-check"></use></svg>
          </button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>

    <div class="modal-root" id="modal-root" hidden>
      <div class="modal-scrim" data-close-modal></div>
      <div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div>
    </div>

    <div class="closed-screen" id="closed-screen" hidden>
      <div class="closed-inner">
        <div class="closed-logo"><svg class="icon icon-28"><use href="#i-scissors"></use></svg></div>
        <h2>已退出编辑</h2>
        <p>当前演示项目已关闭，重新进入会载入示例素材。</p>
        <button class="btn primary" id="btn-reenter" type="button">重新进入</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <div id="guide" class="guide" hidden>
    <div class="guide-spotlight" aria-hidden="true"></div>
    <section class="guide-card" role="dialog" aria-modal="true" aria-labelledby="guide-title" aria-describedby="guide-description">
      <div class="guide-count"></div>
      <h2 id="guide-title" tabindex="-1"></h2>
      <p id="guide-description"></p>
      <div class="guide-actions">
        <button id="guide-skip" type="button">跳过</button>
        <button id="guide-next" type="button">下一步</button>
      </div>
    </section>
  </div>

  <input id="file-video" type="file" accept="video/*" hidden>
  <input id="file-audio" type="file" accept="audio/*" hidden>
  <input id="file-pip" type="file" accept="video/*" hidden>
</body>
</html>
